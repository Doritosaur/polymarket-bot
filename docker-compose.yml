services:
  redis:
    image: redis:alpine
    container_name: polymarket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  bot:
    build: .
    container_name: polymarket-bot
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - POSTGRES_DB=${POSTGRES_DB:-polymarket}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - postgres

  ingest:
    build: .
    container_name: polymarket-ingest
    command: bun run start:ingest
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-adminpassword}
      - POSTGRES_DB=${POSTGRES_DB:-polymarket}
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: polymarket-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adminpassword}
      POSTGRES_DB: ${POSTGRES_DB:-polymarket}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: polymarket-dashboard
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - bot

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: polymarket-cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

volumes:
  redis_data:
  postgres_data:
